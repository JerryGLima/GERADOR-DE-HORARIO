<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Horário de Avaliações</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #640510;
            --primary-hover: #8f2030;
            --primary-light: #f9e8ea;
            --bg-body: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;

            /* Dimensões do documento: 21cm x 14.5cm */
            --pdf-w: 210mm;
            --pdf-h: 145mm;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); overflow-x: hidden; }

        /* ========================
           HEADER
        ======================== */
        .app-header {
            background: var(--primary);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            gap: 10px;
        }
        .app-header-info h1 { font-size: 15px; font-weight: 700; }
        .app-header-info p { font-size: 11px; opacity: 0.8; margin-top: 1px; }
        .btn-sair {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            white-space: nowrap;
            font-family: inherit;
            flex-shrink: 0;
            min-height: 40px;
        }
        .btn-sair:hover { background: rgba(255,255,255,0.25); }

        /* ========================
           ABAS MOBILE
        ======================== */
        .mobile-tabs {
            display: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 64px;
            z-index: 150;
        }
        .mobile-tabs button {
            flex: 1;
            padding: 14px 8px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            min-height: 50px;
        }
        .mobile-tabs button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--primary-light);
        }

        /* ========================
           LAYOUT PRINCIPAL
        ======================== */
        .layout { display: flex; height: calc(100dvh - 64px); }

        /* ========================
           PAINEL EDITOR (ESQUERDA)
        ======================== */
        .editor {
            width: 360px;
            min-width: 360px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            height: 100%;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin: 20px 0 10px;
        }
        .section-title:first-child { margin-top: 0; }

        /* Histórico */
        .historico-box {
            background: var(--bg-body);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .hist-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
        }
        .hist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
            font-size: 13px;
            transition: border-color 0.2s;
        }
        .hist-item:hover { border-color: var(--primary); }
        .hist-item:last-child { margin-bottom: 0; }
        .btn-lixeira {
            background: transparent;
            color: #ef4444;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .btn-lixeira:hover { background: #fee2e2; }

        /* Card de configuração */
        .card-config {
            background: var(--bg-body);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 12px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            color: var(--text-main);
            -webkit-appearance: none;
            appearance: none;
            min-height: 44px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(100,5,16,0.08);
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1.5px dashed var(--border);
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
            background: white;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Dia bloco */
        .dia-bloco {
            background: white;
            border-left: 4px solid var(--primary);
            padding: 14px;
            margin-top: 12px;
            border-radius: 8px;
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .dia-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .dia-titulo { font-weight: 700; font-size: 13px; color: var(--primary); text-transform: uppercase; }
        .btn-remover-dia {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            line-height: 1;
            font-weight: 400;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .btn-remover-dia:hover { background: #fecaca; }

        .materia-item {
            background: var(--bg-body);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid var(--border);
        }
        .materia-item select, .materia-item textarea { margin-bottom: 8px; }
        .materia-item textarea { min-height: 60px; resize: vertical; }
        .btn-add-mat {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1.5px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            transition: all 0.2s;
            font-family: inherit;
            min-height: 44px;
        }
        .btn-add-mat:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

        .btn-add-dia {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            margin-top: 16px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            min-height: 52px;
        }
        .btn-add-dia:hover { background: var(--primary-hover); }
        .btn-add-dia:active { transform: scale(0.98); }

        /* ========================
           PAINEL PREVIEW (DIREITA)
        ======================== */
        .previa {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            padding: 20px;
            min-width: 0;
            background: #eee6e5;
            -webkit-overflow-scrolling: touch;
        }
        .barra-ferramentas {
            background: white;
            padding: 10px 18px;
            border-radius: 100px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .barra-ferramentas label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            text-transform: none;
            letter-spacing: 0;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-tool {
            border: none;
            padding: 9px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            min-height: 40px;
        }
        .btn-save { background: var(--primary-light); color: var(--primary); }
        .btn-save:hover { background: #f1d6da; }
        .btn-tool:disabled { opacity: 0.65; cursor: wait; }
        .btn-pdf { background: var(--primary); color: white; }
        .btn-pdf:hover { background: var(--primary-hover); }
        .btn-tool:active { transform: scale(0.97); }

        /* A prévia é redimensionada sem alterar a composição usada no PDF. */
        .folha-viewport { width: 100%; display: flex; justify-content: center; }
        .folha-wrapper { position: relative; flex: none; }
        .folha-wrapper > .folha-pdf {
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(var(--preview-scale, 1));
            transform-origin: top left;
            box-shadow: 0 10px 30px #39141930;
        }
        .aviso-previa {
            margin: 0 0 12px;
            font-size: 13px;
            color: var(--primary);
            text-align: center;
        }
        .folha-pdf {
            width: var(--pdf-w);
            height: var(--pdf-h);
            background: #cb9591;
            color: var(--primary);
            padding: 4mm;
            display: flex;
            flex-direction: column;
            flex: none;
        }
        .folha-interna {
            background: white;
            border: 1.5px solid var(--primary);
            border-radius: 16px;
            min-height: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 3mm 5.5mm 4mm;
        }
        .header-pdf {
            display: grid;
            grid-template-columns: minmax(0, 1.06fr) minmax(0, 1.14fr) auto;
            align-items: center;
            flex: none;
            min-height: 23mm;
            margin-bottom: 2mm;
        }
        .header-escola-pdf { padding-right: 2mm; overflow-wrap: anywhere; }
        .header-escola-pdf h2 {
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.18;
        }
        .header-escola-pdf h1 {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.1;
            margin-top: 2px;
        }
        .header-faixas-pdf {
            display: grid;
            grid-template-columns: minmax(0, 1.24fr) minmax(0, 1fr);
            border-radius: 32px 0 0 32px;
            overflow: hidden;
        }
        .faixa-serie-pdf, .faixa-prof-pdf {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 13mm;
            padding: 5px 8px;
            color: white;
            text-align: center;
            overflow-wrap: anywhere;
            line-height: 1.14;
        }
        .faixa-serie-pdf { background: var(--primary); }
        .faixa-prof-pdf { background: #8b5359; }
        .header-faixas-pdf .l1 { font-size: 15px; font-weight: 800; }
        .faixa-serie-pdf .l1 { text-transform: uppercase; }
        .header-faixas-pdf .l2 { font-size: 10px; font-weight: 700; margin-top: 2px; }
        .foto-prof-box {
            width: 20mm;
            height: 23mm;
            border: 3px solid var(--primary);
            background-color: var(--primary-light);
            background-size: cover;
            background-position: center;
        }
        .quadro-pdf {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            border: 1px solid var(--primary);
            border-radius: 12px;
            overflow: hidden;
            padding: 4px 4px 0;
        }
        .grid-pdf {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .col-pdf {
            --body-size: 11.5px;
            --title-size: 14.5px;
            --image-height: 68px;
            --topic-gap: 5px;
            --subject-gap: 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            padding: 0 4px;
        }
        .col-pdf:first-child { padding-left: 0; }
        .col-pdf:last-child { padding-right: 0; }
        .col-pdf + .col-pdf { border-left: 1px solid #d9babc; }
        .col-pdf.densa {
            --body-size: 10.5px;
            --title-size: 13px;
            --image-height: 50px;
            --topic-gap: 4px;
            --subject-gap: 6px;
        }
        .col-pdf.compacta {
            --body-size: 10px;
            --title-size: 12px;
            --image-height: 35px;
            --topic-gap: 2px;
            --subject-gap: 4px;
        }
        .topo-dia {
            background: #80343f;
            color: white;
            text-align: center;
            padding: 4px 2px;
            flex: none;
        }
        .col-pdf:nth-child(even) .topo-dia { background: var(--primary); }
        .topo-dia .dia-nome { font-size: 9px; font-weight: 600; line-height: 1.2; }
        .topo-dia .dia-data { font-size: 14px; font-weight: 800; line-height: 1.2; }
        .conteudo-dia { flex: 1; min-height: 0; overflow: hidden; padding: 8px 4px 2px; }
        .materia-box + .materia-box {
            margin-top: var(--subject-gap);
            padding-top: var(--subject-gap);
            border-top: 1px solid #e8d6d7;
        }
        .materia-tit { font-size: var(--title-size); font-weight: 800; line-height: 1.12; overflow-wrap: anywhere; }
        .materia-cont { font-size: var(--body-size); line-height: 1.28; margin-top: 4px; overflow-wrap: anywhere; }
        .topico { position: relative; padding-left: 9px; font-weight: 600; white-space: pre-wrap; }
        .topico + .topico, .paginas + .topico { margin-top: var(--topic-gap); }
        .topico::before { content: '•'; position: absolute; left: 0; font-weight: 800; }
        .paginas { padding-left: 9px; color: #654044; white-space: pre-wrap; }
        .materia-img { display: block; max-width: 80%; max-height: var(--image-height); margin: 5px auto 0; }
        .grade-vazia { margin: auto; padding: 12px; font-size: 13px; text-align: center; color: #806369; }
        .rodape-pdf {
            flex: none;
            overflow-wrap: anywhere;
            text-align: center;
            margin: 0 8px 3px;
            padding: 5px 0 1px;
            border-top: 1px solid #e8d6d7;
            font-size: 12px;
            font-weight: 800;
        }
        .hist-abrir {
            flex: 1;
            min-width: 0;
            text-align: left;
            font: inherit;
            color: inherit;
            border: 0;
            background: none;
            cursor: pointer;
        }
        .materia-acoes { display: flex; justify-content: flex-end; margin: 5px 0 0; }
        .btn-remover-mat {
            padding: 5px;
            border: 0;
            background: transparent;
            color: var(--primary);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        .pagina-exportacao {
            width: var(--pdf-w);
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
        }
        .suporte-exportacao {
            width: 190mm;
            height: 131.2mm;
            flex: none;
            position: relative;
        }
        .suporte-exportacao .folha-pdf {
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(0.90476);
            transform-origin: top left;
        }
        .linha-corte {
            width: 190mm;
            padding-top: 2px;
            border-top: 1px dashed #997e80;
            color: #654044;
            text-align: right;
            font-size: 9px;
        }
        #pdf-render-zone { position: fixed; left: -9999px; top: 0; z-index: -1; background: white; }

        /* ========================
           TOAST NOTIFICATION
        ======================== */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            transition: transform 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { background: #166534; }
        #toast.error { background: #991b1b; }

        /* ========================
           RESPONSIVO MOBILE
        ======================== */
        @media (max-width: 768px) {
            .layout { height: auto; flex-direction: column; }
            .mobile-tabs { display: flex; top: 64px; }
            
            .editor {
                width: 100%;
                min-width: unset;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                display: none;
                padding: 14px;
                overflow-y: visible;
            }
            .editor.mobile-active { display: block; }

            .previa { 
                display: none; 
                padding: 14px;
                min-height: calc(100vh - 110px);
            }
            .previa.mobile-active { display: flex; }

            .barra-ferramentas { 
                border-radius: 12px; 
                padding: 12px 14px; 
                gap: 8px;
                width: 100%;
                justify-content: center;
            }

            /* Inputs maiores no mobile para evitar zoom automático */
            input[type="text"], input[type="number"], 
            input[type="date"], 
            select, 
            textarea { font-size: 16px !important; }

            .btn-add-dia { padding: 16px; font-size: 15px; }
            .btn-tool { padding: 11px 16px; font-size: 14px; }
        }

    </style>
</head>
<body>

<div class="app-header">
    <div class="app-header-info">
        <h1>✏️ CONFIGURAR HORÁRIO</h1>
        <p id="header-nome-prof">Carregando...</p>
    </div>
    <button class="btn-sair" onclick="sair()">
        <i data-lucide="log-out" style="width:15px;height:15px;"></i> Sair
    </button>
</div>

<div class="mobile-tabs">
    <button class="active" onclick="trocarAba('editor', this)">
        <i data-lucide="pencil" style="width:15px;height:15px;"></i> Editar
    </button>
    <button onclick="trocarAba('previa', this)">
        <i data-lucide="eye" style="width:15px;height:15px;"></i> Visualizar
    </button>
</div>

<div class="layout">

    <!-- PAINEL EDITOR -->
    <div class="editor mobile-active" id="painel-editor">

        <div class="historico-box">
            <div class="hist-header">
                <i data-lucide="folder-clock" style="width:16px;height:16px;color:var(--primary)"></i>
                Meus Horários Salvos
            </div>
            <div id="lista-historico">
                <p style="font-size:13px;color:var(--text-muted);text-align:center;padding:8px 0;">Nenhum horário salvo ainda.</p>
            </div>
        </div>

        <p class="section-title">Dados Gerais</p>
        <div class="card-config">
            <label for="f-prof">Sua foto</label>
            <input type="file" accept="image/*" onchange="uploadImg('outFoto', this.id, 300)" id="f-prof">
            <label for="inNomeProf">Seu nome no PDF</label>
            <input type="text" id="inNomeProf" placeholder="Ex: Maria Silva" oninput="atualizarPrevia()">
            <label for="inEscola">Escola</label>
            <input type="text" id="inEscola" value="Colégio Elicéu Monteiro Alves" oninput="atualizarPrevia()">
            <label for="inSerie">Série / Turma</label>
            <select id="inSerie" onchange="atualizarPrevia()">
                <option value="">Carregando...</option>
            </select>
            <label for="inBimestre">Bimestre</label>
            <select id="inBimestre" onchange="atualizarPrevia()">
                <option value="">Carregando...</option>
            </select>
            <label for="inAno">Ano letivo</label>
            <input type="number" id="inAno" min="1900" max="9999" placeholder="Ano da primeira avaliação" oninput="atualizarPrevia()">
            <label for="inRodape">Frase do rodapé</label>
            <input type="text" id="inRodape" value="Boa sorte e bons estudos!" placeholder="Deixe em branco para ocultar" oninput="atualizarPrevia()" style="margin-bottom:0">
        </div>

        <p class="section-title">Dias de Avaliação</p>
        <div id="lista-dias-editor"></div>

        <button class="btn-add-dia" onclick="adicionarDia()">
            <i data-lucide="plus-circle" style="width:18px;height:18px;"></i>
            Adicionar Dia (máx. 5)
        </button>

        <div style="height: 30px;"></div>

        <div style="
            margin-top: auto;
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.5;
        ">
            Desenvolvido por <strong style="color: var(--primary);">Jerry Gleydison</strong> — Abril 2026
        </div>
    </div>

    <!-- PAINEL PREVIEW -->
    <div class="previa" id="painel-previa">
        <div class="barra-ferramentas">
            <label>

<script>
    window.lucide?.createIcons();

    window.trocarAba = (qual, btn) => {
        document.querySelectorAll('.mobile-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (qual === 'editor') {
            document.getElementById('painel-editor').classList.add('mobile-active');
            document.getElementById('painel-previa').classList.remove('mobile-active');
        } else {
            document.getElementById('painel-previa').classList.add('mobile-active');
            document.getElementById('painel-editor').classList.remove('mobile-active');
        }
    };

    // Toast helper
    window.showToast = (msg, tipo = 'success') => {
        const t = document.getElementById('toast');
        t.textContent = tipo === 'success' ? '✓ ' + msg : '✗ ' + msg;
        t.className = 'show ' + tipo;
        setTimeout(() => t.className = '', 3000);
    };
</script>

<script type="module">
    import { db, auth } from "./firebase-config.js";
    import { 
        collection, getDocs, getDoc, addDoc, doc, deleteDoc, 
        serverTimestamp, query, where, orderBy, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    let disciplinasList = [];
    let diasAtivos = 0;
    let logoPadrao = '';

    const folha = document.getElementById('folha-pdf');
    const viewport = document.getElementById('folha-viewport');
    const wrapper = document.getElementById('folha-wrapper');
    const grid = document.getElementById('outGrid');
    const campoRodape = document.getElementById('inRodape');
    const rodape = document.getElementById('outRodape');
    const aviso = document.getElementById('aviso-previa');

    new ResizeObserver(() => {
        if (!viewport.clientWidth) return;
        const escala = Math.min(1, viewport.clientWidth / folha.offsetWidth);
        wrapper.style.setProperty('--preview-scale', escala);
        wrapper.style.width = `${folha.offsetWidth * escala}px`;
        wrapper.style.height = `${folha.offsetHeight * escala}px`;
        ajustarConteudo();
    }).observe(viewport);
    document.fonts.ready.then(ajustarConteudo);

    window.sair = () => { signOut(auth); window.location.href = "index.html"; };

    // ========================
    // INICIALIZAÇÃO
    // ========================
    async function init() {
        try {
            // CORREÇÃO: usa orderBy para garantir ordem consistente no recarregamento
            const [sSnap, bSnap, dSnap] = await Promise.all([
                getDocs(query(collection(db, "series"), orderBy("nome", "asc"))),
                getDocs(query(collection(db, "bimestres"), orderBy("nome", "asc"))),
                getDocs(query(collection(db, "disciplinas"), orderBy("nome", "asc")))
            ]);

            const selSerie = document.getElementById('inSerie');
            const selBimestre = document.getElementById('inBimestre');

            selSerie.innerHTML = '<option value="">Selecione a série</option>';
            sSnap.forEach(d => {
                selSerie.add(new Option(d.data().nome, d.data().nome));
            });

            selBimestre.innerHTML = '<option value="">Selecione o bimestre</option>';
            bSnap.forEach(d => {
                selBimestre.add(new Option(d.data().nome, d.data().nome));
            });

            // CORREÇÃO: disciplinas ordenadas de forma consistente
            disciplinasList = dSnap.docs.map(d => d.data().nome);

            const nGoogle = localStorage.getItem('prof_nome') || '';
            document.getElementById('inNomeProf').value = nGoogle;
            document.getElementById('header-nome-prof').textContent = nGoogle || auth.currentUser?.email || '';

            // Carrega logo da escola
            try {
                const escSnap = await getDoc(doc(db, "configuracoes", "escola"));
                if (escSnap.exists() && escSnap.data().logo) {
                    logoPadrao = escSnap.data().logo;
                    document.getElementById('pdfLogoEscola').src = logoPadrao;
                }
            } catch(e) { console.warn("Logo não encontrado"); }

            carregarHistorico(auth.currentUser.email);
            window.lucide?.createIcons();
            atualizarPrevia();

        } catch(e) {
            console.error("Erro na inicialização:", e);
        }
    }

    // ========================
    // COMPRESSÃO DE IMAGEM
    // ========================
    async function compress(file, target, preserveTransparency = false) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        try {
            img.src = url;
            await img.decode();
            const canvas = document.createElement('canvas');
            const scale = Math.min(1, target / Math.max(img.naturalWidth, img.naturalHeight));
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            const context = canvas.getContext('2d');
            if (!preserveTransparency) {
                context.fillStyle = 'white';
                context.fillRect(0, 0, canvas.width, canvas.height);
            }
            context.drawImage(img, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL(preserveTransparency ? 'image/webp' : 'image/jpeg', 0.85);
        } finally {
            URL.revokeObjectURL(url);
        }
    }

    async function carregarImagem(inputId, targetId, size, isSubject) {
        const input = document.getElementById(inputId);
        const file = input.files[0];
        if (!file) return;
        try {
            const image = await compress(file, size, isSubject);
            const target = document.getElementById(targetId);
            if (!target || input.files[0] !== file) return;
            if (isSubject) {
                target.value = image;
                target.closest('.materia-item').querySelector('.btn-remover-imagem').hidden = false;
            } else {
                target.src = image;
            }
            atualizarPrevia();
        } catch (error) {
            if (input.files[0] !== file) return;
            input.value = '';
            showToast('Não foi possível abrir essa imagem.', 'error');
        }
    }

    window.uploadImg = (id, inputId, size) => carregarImagem(inputId, id, size, false);
    window.uploadFotoMat = (inputId, hidId) => carregarImagem(inputId, hidId, 250, true);

    // ========================
    // HISTÓRICO
    // ========================
    function carregarHistorico(email) {
        // CORREÇÃO: orderBy garante que os dados apareçam na ordem correta após reload
        const q = query(
            collection(db, "horarios_salvos"), 
            where("professor", "==", email), 
            orderBy("criadoEm", "desc")
        );
        
        onSnapshot(q, (snap) => {
            const cont = document.getElementById('lista-historico');
            if (snap.empty) {
                cont.innerHTML = '<p style="font-size:13px;color:var(--text-muted);text-align:center;padding:8px 0;">Nenhum horário salvo ainda.</p>';
                return;
            }
            cont.innerHTML = '';
            snap.forEach(d => {
                const item = document.createElement('div');
                item.className = 'hist-item';
                const data = d.data();
                const serie = data.serie || '—';
                const bimestre = data.bimestre || '';
                
                item.innerHTML = `
                    <button type="button" class="hist-abrir">
                        <strong style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></strong>
                        <span style="color:var(--text-muted);font-size:11px;"></span>
                    </button>
                    <button type="button" class="btn-lixeira" aria-label="Excluir horário" title="Excluir horário">
                        <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                    </button>`;
                const abrir = item.querySelector('.hist-abrir');
                abrir.querySelector('strong').textContent = serie;
                abrir.querySelector('span').textContent = bimestre;
                abrir.addEventListener('click', () => loadSch(data));
                item.querySelector('.btn-lixeira').addEventListener('click', event => delHist(d.id, event));
                cont.appendChild(item);
            });
            window.lucide?.createIcons();
        }, (error) => {
            console.error("Erro ao carregar histórico:", error);
        });
    }

    window.delHist = async (id, e) => {
        e.stopPropagation();
        if (confirm("Excluir este horário?")) {
            try {
                await deleteDoc(doc(db, "horarios_salvos", id));
            } catch(e) { showToast("Erro ao excluir", "error"); }
        }
    };

    // ========================
    // CARREGAR HORÁRIO SALVO
    // BUG CORRIGIDO: disciplinas misturando de dia
    // Causa: Date.now() colide quando dias são criados em sequência
    // rápida. Solução: contador estável + flag _carregando para
    // suprimir re-renders parciais durante a montagem.
    // ========================
    let _carregando = false;

    window.loadSch = (dados) => {
        _carregando = true;  // bloqueia atualizarPrevia() durante montagem

        document.getElementById('lista-dias-editor').innerHTML = '';
        diasAtivos = 0;

        document.getElementById('inEscola').value = dados.escola || '';
        document.getElementById('inNomeProf').value = dados.professorNomeManual || dados.professor || '';
        document.getElementById('inAno').value = dados.anoLetivo || '';
        campoRodape.value = dados.fraseRodape ?? campoRodape.defaultValue;
        document.getElementById('f-prof').value = '';

        const selSerie = document.getElementById('inSerie');
        const selBimestre = document.getElementById('inBimestre');
        
        selSerie.value = dados.serie || '';
        if (selSerie.value !== dados.serie && dados.serie) {
            selSerie.add(new Option(dados.serie, dados.serie));
            selSerie.value = dados.serie;
        }

        selBimestre.value = dados.bimestre || '';
        if (selBimestre.value !== dados.bimestre && dados.bimestre) {
            selBimestre.add(new Option(dados.bimestre, dados.bimestre));
            selBimestre.value = dados.bimestre;
        }

        const logo = document.getElementById('pdfLogoEscola');
        const foto = document.getElementById('outFoto');
        const logoSalvo = dados.logoEscola || logoPadrao;
        if (logoSalvo) logo.src = logoSalvo;
        else logo.removeAttribute('src');
        if (dados.fotoProf) foto.src = dados.fotoProf;
        else foto.removeAttribute('src');

        const conteudo = Array.isArray(dados.conteudo) ? dados.conteudo : [];
        conteudo.forEach(dia => {
            // adicionarDia() agora usa ID de contador (dia_1, dia_2...)
            // garantindo unicidade mesmo quando chamado em sequência rápida
            const idDia = adicionarDia();
            if (!idDia) return;

            const bloco = document.getElementById(`bloco-${idDia}`);
            if (!bloco) return;

            bloco.querySelector('.data-input').value = dia.data || '';

            const materias = Array.isArray(dia.materias) ? dia.materias : [];
            materias.forEach(mat => {
                // addMateria recebe o idDia CORRETO deste dia — sem confusão de containers
                const mId = addMateria(idDia);
                const div = document.getElementById(mId);
                if (!div) return;
                const select = div.querySelector('.m-sel');
                select.value = mat.nome || '';
                if (mat.nome && select.value !== mat.nome) select.add(new Option(mat.nome, mat.nome, false, true));
                div.querySelector('.m-txt').value = mat.conteudo || '';
                if (ehImagem(mat.imagem)) {
                    div.querySelector('.m-img-base64').value = mat.imagem;
                    div.querySelector('.btn-remover-imagem').hidden = false;
                }
            });
        });

        // Libera o lock e renderiza o preview UMA ÚNICA VEZ com tudo pronto
        _carregando = false;
        atualizarPrevia();
        window.lucide?.createIcons();
        
        if (window.innerWidth <= 768) {
            const prevBtn = document.querySelector('.mobile-tabs button:nth-child(2)');
            if (prevBtn) trocarAba('previa', prevBtn);
        }
    };

    // ========================
    // ADICIONAR DIA
    // CORREÇÃO: usa contador incremental em vez de Date.now()
    // para evitar colisão de IDs quando vários dias são criados
    // rapidamente (ex: ao carregar horário salvo)
    // ========================
    let _diaCounter = 0;
    window.adicionarDia = () => {
        if (diasAtivos >= 5) { 
            showToast("Máximo de 5 dias por horário!", "error"); 
            return null; 
        }
        // ID único e estável baseado em contador, não em timestamp
        const id = 'dia_' + (++_diaCounter);
        const div = document.createElement('div');
        div.className = 'dia-bloco'; 
        div.id = `bloco-${id}`;
        div.innerHTML = `
            <div class="dia-header">
                <span class="dia-titulo">Dia ${diasAtivos + 1}</span>
                <button class="btn-remover-dia" onclick="removerDia(this)" title="Remover dia">×</button>
            </div>
            <label for="${id}-data">Data</label>
            <input type="date" id="${id}-data" class="data-input" onchange="atualizarPrevia()">
            <div id="m-cont-${id}"></div>
            <button class="btn-add-mat" onclick="addMateria('${id}')">+ Adicionar Matéria</button>`;
        document.getElementById('lista-dias-editor').appendChild(div);
        diasAtivos++;
        atualizarPrevia();
        return id;
    };

    // CORREÇÃO: função dedicada para remover dia e reordenar títulos
    window.removerDia = (btn) => {
        btn.closest('.dia-bloco').remove();
        diasAtivos = Math.max(0, diasAtivos - 1);
        // Reordenar títulos dos dias
        document.querySelectorAll('.dia-bloco .dia-titulo').forEach((titulo, i) => {
            titulo.textContent = `Dia ${i + 1}`;
        });
        atualizarPrevia();
    };

    // ========================
    // ADICIONAR MATÉRIA
    // ========================
    window.addMateria = (diaId) => {
        const mId = "mat-" + Math.random().toString(36).substr(2, 9);
        const div = document.createElement('div');
        div.id = mId; 
        div.className = "materia-item";
        div.innerHTML = `
            <select class="m-sel" aria-label="Matéria" onchange="atualizarPrevia()">
                <option value="">Selecione a matéria</option>
            </select>
            <textarea class="m-txt" aria-label="Conteúdo da avaliação" placeholder="Um tópico por linha. Exemplo:\nOrtografia\nPágs. 214 a 218" oninput="atualizarPrevia()" rows="3"></textarea>
            <input type="file" aria-label="Ilustração da matéria" accept="image/*" onchange="uploadFotoMat(this.id, '${mId}-base')" id="${mId}-file" style="margin-bottom:0;">
            <input type="hidden" class="m-img-base64" id="${mId}-base">
            <div class="materia-acoes">
                <button type="button" class="btn-remover-mat btn-remover-imagem" hidden>Remover ilustração</button>
                <button type="button" class="btn-remover-mat btn-excluir-materia">Remover matéria</button>
            </div>`;
        const select = div.querySelector('.m-sel');
        disciplinasList.forEach(nome => select.add(new Option(nome, nome)));
        const removerImagem = div.querySelector('.btn-remover-imagem');
        removerImagem.addEventListener('click', () => {
            div.querySelector('.m-img-base64').value = '';
            div.querySelector('input[type="file"]').value = '';
            removerImagem.hidden = true;
            atualizarPrevia();
        });
        div.querySelector('.btn-excluir-materia').addEventListener('click', () => {
            div.remove();
            atualizarPrevia();
        });
        document.getElementById(`m-cont-${diaId}`).appendChild(div);
        return mId;
    };

    // ========================
    // ATUALIZAR PRÉVIA
    // ========================
    function criarElemento(tag, classe, texto = '') {
        const elemento = document.createElement(tag);
        elemento.className = classe;
        elemento.textContent = texto;
        return elemento;
    }

    function ajustarConteudo() {
        if (!folha.offsetWidth) return false;

        const diasCheios = [];
        grid.querySelectorAll('.col-pdf').forEach(coluna => {
            const conteudo = coluna.querySelector('.conteudo-dia');
            coluna.classList.remove('densa', 'compacta');
            if (conteudo.scrollHeight > conteudo.clientHeight) coluna.classList.add('densa');
            if (conteudo.scrollHeight > conteudo.clientHeight) coluna.classList.add('compacta');
            if (conteudo.scrollHeight > conteudo.clientHeight) diasCheios.push(coluna.querySelector('.dia-data').textContent);
        });
        aviso.hidden = diasCheios.length === 0;
        aviso.textContent = diasCheios.length
            ? 'Reduza o conteúdo ou as ilustrações dos dias ' + diasCheios.join(', ') + ' para gerar o PDF completo.'
            : '';
        return diasCheios.length === 0;
    }

    const ehImagem = fonte => /^data:image\/(?:png|jpeg|webp|gif);base64,/i.test(fonte || '');
    const formatoData = new Intl.DateTimeFormat('pt-BR', {dateStyle: 'short', timeZone: 'UTC'});
    const formatoDia = new Intl.DateTimeFormat('pt-BR', {weekday: 'long', timeZone: 'UTC'});

    window.atualizarPrevia = () => {
        if (_carregando) return;
        const dias = Array.from(document.querySelectorAll('.dia-bloco'), bloco => ({
            bloco,
            data: bloco.querySelector('.data-input').value
        })).sort((a, b) => (a.data || '9999-99-99').localeCompare(b.data || '9999-99-99'));

        const bimestre = document.getElementById('inBimestre').value;
        const anoManual = document.getElementById('inAno').value;
        const anoData = dias[0]?.data.slice(0, 4) || '';
        const anoNoBimestre = /\b(?:19|20)\d{2}\b/.test(bimestre);
        const periodo = anoManual
            ? [bimestre.replace(/\s*[-–/]?\s*\b(?:19|20)\d{2}\s*$/, ''), anoManual].filter(Boolean).join(' ')
            : [bimestre, anoNoBimestre ? '' : anoData].filter(Boolean).join(' ');

        document.getElementById('outEscola').textContent =
            (document.getElementById('inEscola').value.trim() || 'Escola').toUpperCase();
        document.getElementById('outSerie').textContent = document.getElementById('inSerie').value || 'Turma';
        document.getElementById('outBimestre').textContent = periodo || 'Bimestre';
        document.getElementById('outProf').textContent = document.getElementById('inNomeProf').value.trim() || 'Docente';
        rodape.textContent = campoRodape.value.trim();
        rodape.hidden = !rodape.textContent;

        const foto = document.getElementById('outFoto').getAttribute('src');
        const fotoBox = document.getElementById('foto-prof-box');
        fotoBox.hidden = !ehImagem(foto);
        fotoBox.style.backgroundImage = fotoBox.hidden ? '' : 'url("' + foto + '")';

        grid.replaceChildren();
        if (!dias.length) {
            grid.append(criarElemento('p', 'grade-vazia', 'Adicione os dias de avaliação para montar o horário.'));
        }

        dias.forEach(({bloco, data}) => {
            const dataFormatada = data ? new Date(data + 'T12:00:00Z') : null;
            const coluna = criarElemento('div', 'col-pdf');
            const topo = criarElemento('div', 'topo-dia');
            topo.append(
                criarElemento('div', 'dia-nome', dataFormatada ? formatoDia.format(dataFormatada).toUpperCase() : 'AVALIAÇÃO'),
                criarElemento('div', 'dia-data', dataFormatada ? formatoData.format(dataFormatada) : 'Sem data')
            );
            const conteudo = criarElemento('div', 'conteudo-dia');
            bloco.querySelectorAll('.materia-item').forEach(item => {
                const nome = item.querySelector('.m-sel').value;
                if (!nome) return;

                const materia = criarElemento('section', 'materia-box');
                materia.append(criarElemento('h3', 'materia-tit', nome));
                const texto = criarElemento('div', 'materia-cont');
                item.querySelector('.m-txt').value.split(/\r?\n/).forEach(linha => {
                    const limpa = linha.trim().replace(/^(?:[•●]\s*|[-–]\s+)/, '');
                    if (!limpa) return;
                    const paginas = /^(?:p[áa]g(?:ina)?s?\.?|pp?\.)(?:\s|:|\d)/i.test(limpa);
                    texto.append(criarElemento('div', paginas ? 'paginas' : 'topico', limpa));
                });
                if (texto.childElementCount) materia.append(texto);

                const fonte = item.querySelector('.m-img-base64').value;
                if (ehImagem(fonte)) {
                    const imagem = criarElemento('img', 'materia-img');
                    imagem.alt = '';
                    imagem.addEventListener('load', ajustarConteudo, { once: true });
                    imagem.src = fonte;
                    materia.append(imagem);
                }
                conteudo.append(materia);
            });
            coluna.append(topo, conteudo);
            grid.append(coluna);
        });
        ajustarConteudo();
    };

    // ========================
    // SALVAR NO BANCO
    // ========================
    window.salvarNoBanco = async () => {
        const conteudo = [];
        document.querySelectorAll('.dia-bloco').forEach(bl => {
            const mats = [];
            bl.querySelectorAll('.materia-item').forEach(mi => {
                mats.push({ 
                    nome: mi.querySelector('.m-sel').value, 
                    conteudo: mi.querySelector('.m-txt').value, 
                    imagem: mi.querySelector('.m-img-base64').value 
                });
            });
            // CORREÇÃO: inclui índice de ordem para recuperação consistente
            conteudo.push({ 
                data: bl.querySelector('.data-input').value, 
                materias: mats 
            });
        });

        try {
            await addDoc(collection(db, "horarios_salvos"), {
                professor: auth.currentUser.email,
                professorNomeManual: document.getElementById('inNomeProf').value,
                escola: document.getElementById('inEscola').value,
                serie: document.getElementById('inSerie').value,
                bimestre: document.getElementById('inBimestre').value,
                anoLetivo: document.getElementById('inAno').value,
                fraseRodape: campoRodape.value.trim(),
                logoEscola: document.getElementById('pdfLogoEscola').getAttribute('src') || '',
                fotoProf: document.getElementById('outFoto').getAttribute('src') || '',
                conteudo,
                criadoEm: serverTimestamp()  // CORREÇÃO: garante ordem cronológica no Firebase
            });
            showToast("Horário salvo com sucesso!", "success");
        } catch(e) {
            console.error(e);
            showToast("Erro ao salvar. Tente novamente.", "error");
        }
    };

    // ========================
    // GERAR PDF — 21cm x 14.5cm
    // Permite 2 documentos por folha A4 sem distorções
    // ========================
    window.baixarPDF = async () => {
        const botao = document.getElementById('btn-pdf');
        if (botao.disabled) return;
        if (!grid.querySelector('.materia-box')) {
            showToast('Selecione pelo menos uma matéria para gerar o horário.', 'error');
            return;
        }
        if (Array.from(grid.querySelectorAll('.dia-data')).some(data => data.textContent === 'Sem data')) {
            showToast('Preencha a data de todos os dias antes de gerar o PDF.', 'error');
            return;
        }

        const duplo = document.getElementById('checkDuplo').checked;
        const zone = document.getElementById('pdf-render-zone');
        botao.disabled = true;

        try {
            await document.fonts.ready;
            await Promise.all(Array.from(folha.querySelectorAll('.materia-img'), imagem => imagem.decode().catch(() => {})));
            if (!ajustarConteudo()) {
                showToast('O conteúdo ultrapassa o espaço do horário. Confira o aviso na prévia.', 'error');
                return;
            }

            const pagina = criarElemento('div', 'pagina-exportacao');
            // Reserva 1 mm para evitar uma página extra por arredondamento na rasterização.
            pagina.style.height = duplo ? '296mm' : '144mm';
            const copiarFolha = () => {
                const suporte = criarElemento('div', 'suporte-exportacao');
                suporte.append(folha.cloneNode(true));
                suporte.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
                return suporte;
            };
            pagina.append(copiarFolha());
            if (duplo) {
                const corte = criarElemento('div', 'linha-corte', 'Corte aqui');
                pagina.append(corte, copiarFolha());
            }
            zone.append(pagina);

            const turma = document.getElementById('inSerie').value.replace(/[\\/:*?"<>|]/g, '-').trim();
            await html2pdf().set({
                margin: 0,
                filename: 'Horario_' + (turma || 'Escola') + (duplo ? '_Duplo' : '') + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 3, useCORS: true, logging: false },
                pagebreak: { mode: [] },
                jsPDF: { unit: 'mm', format: duplo ? 'a4' : [210, 145], orientation: duplo ? 'portrait' : 'landscape' }
            }).from(pagina).save();
        } catch (error) {
            console.error('Erro ao gerar PDF:', error);
            showToast('Erro ao gerar PDF. Tente novamente.', 'error');
        } finally {
            zone.replaceChildren();
            botao.disabled = false;
        }
    };

    // ========================
    // AUTH STATE
    // ========================
    auth.onAuthStateChanged(u => {
        if (u) {
            init();
        } else {
            window.location.href = "index.html";
        }
    });
</script>
</body>
</html>
